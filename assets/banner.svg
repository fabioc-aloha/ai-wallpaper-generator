<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    
    <!-- Title text gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8250df;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Phone screen glow -->
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0078d4;stop-opacity:0" />
    </radialGradient>
    
    <!-- Filter for glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Geometric grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#f6f8fa" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#f6f8fa" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#f6f8fa" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#f6f8fa" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#f6f8fa" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#f6f8fa" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="400" stroke="#f6f8fa" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke="#f6f8fa" stroke-width="1"/>
  </g>
  
  <!-- Floating particles -->
  <circle cx="150" cy="80" r="3" fill="#f6f8fa" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="120" r="2" fill="#0078d4" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="280" r="3" fill="#8250df" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="320" r="2" fill="#fb8500" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Left side: Abstract wallpaper samples -->
  <g opacity="0.3">
    <!-- Sample 1 -->
    <rect x="50" y="100" width="80" height="140" rx="10" fill="url(#titleGradient)" opacity="0.5"/>
    <!-- Sample 2 -->
    <rect x="145" y="120" width="80" height="140" rx="10" fill="#fb8500" opacity="0.4"/>
  </g>
  
  <!-- Right side: Azure cloud icon and neural network visualization -->
  <g opacity="0.3" transform="translate(1000, 100)">
    <!-- Azure cloud icon simplified -->
    <path d="M 20 40 L 40 0 L 80 40 L 60 40 L 70 60 L 10 60 L 30 40 Z" 
          fill="#0078d4" opacity="0.6"/>
    <!-- Neural network nodes -->
    <circle cx="50" cy="100" r="5" fill="#8250df" opacity="0.8"/>
    <circle cx="30" cy="120" r="4" fill="#8250df" opacity="0.6"/>
    <circle cx="70" cy="120" r="4" fill="#8250df" opacity="0.6"/>
    <circle cx="50" cy="140" r="5" fill="#8250df" opacity="0.8"/>
    <!-- Connections -->
    <line x1="50" y1="100" x2="30" y2="120" stroke="#8250df" stroke-width="1" opacity="0.4"/>
    <line x1="50" y1="100" x2="70" y2="120" stroke="#8250df" stroke-width="1" opacity="0.4"/>
    <line x1="30" y1="120" x2="50" y2="140" stroke="#8250df" stroke-width="1" opacity="0.4"/>
    <line x1="70" y1="120" x2="50" y2="140" stroke="#8250df" stroke-width="1" opacity="0.4"/>
  </g>
  
  <!-- Center: iPhone 16 Pro mockup -->
  <g transform="translate(540, 130)">
    <!-- Phone glow -->
    <ellipse cx="60" cy="70" rx="80" ry="100" fill="url(#screenGlow)"/>
    
    <!-- Phone body -->
    <rect x="20" y="10" width="80" height="140" rx="12" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
    
    <!-- Screen -->
    <rect x="25" y="15" width="70" height="130" rx="10" fill="#0d1117"/>
    
    <!-- Dynamic Island -->
    <ellipse cx="60" cy="25" rx="15" ry="4" fill="#000000"/>
    
    <!-- Screen content - colorful wallpaper preview -->
    <rect x="27" y="30" width="66" height="110" rx="8">
      <animate attributeName="fill" 
               values="#0078d4;#8250df;#fb8500;#1a7f37;#0078d4" 
               dur="10s" 
               repeatCount="indefinite"/>
    </rect>
    
    <!-- Home indicator -->
    <rect x="48" y="137" width="24" height="3" rx="1.5" fill="#555555"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="280" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
        font-size="56" font-weight="900" text-anchor="middle" 
        fill="url(#titleGradient)" filter="url(#glow)">
    AI WALLPAPER GENERATOR
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="320" font-family="'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
        font-size="20" font-weight="400" text-anchor="middle" 
        fill="#f6f8fa" opacity="0.8">
    iPhone 16 Pro • Azure Serverless • Replicate AI
  </text>
  
  <!-- PWA icon badge -->
  <g transform="translate(900, 30)">
    <circle cx="20" cy="20" r="20" fill="#8250df" opacity="0.8"/>
    <text x="20" y="28" font-family="Arial" font-size="24" font-weight="bold" 
          text-anchor="middle" fill="#ffffff">⚡</text>
  </g>
  
  <!-- Small tech badges -->
  <g transform="translate(70, 340)" opacity="0.6">
    <rect width="60" height="20" rx="10" fill="#0078d4"/>
    <text x="30" y="14" font-family="Arial" font-size="12" font-weight="600" 
          text-anchor="middle" fill="#ffffff">Azure</text>
  </g>
  
  <g transform="translate(140, 340)" opacity="0.6">
    <rect width="60" height="20" rx="10" fill="#1a7f37"/>
    <text x="30" y="14" font-family="Arial" font-size="12" font-weight="600" 
          text-anchor="middle" fill="#ffffff">PWA</text>
  </g>
  
  <g transform="translate(210, 340)" opacity="0.6">
    <rect width="80" height="20" rx="10" fill="#fb8500"/>
    <text x="40" y="14" font-family="Arial" font-size="12" font-weight="600" 
          text-anchor="middle" fill="#ffffff">Replicate</text>
  </g>
</svg>
